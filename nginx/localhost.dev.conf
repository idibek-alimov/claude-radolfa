# =============================================================================
# Local Development — localhost
# Matches requests coming in as localhost (dev Docker setup).
# In production this block is never hit because all traffic arrives
# via the real domain names (radolfa.site / api.radolfa.site).
# =============================================================================

server {
    listen 80 default_server;
    server_name localhost _;

    # Nginx health check
    location /nginx-health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API — proxy to Spring Boot backend
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Ops portal static assets — immutable 1-year cache
    location /ops/_next/static/ {
        proxy_pass         http://ops;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        add_header         Cache-Control "public, max-age=31536000, immutable";
        access_log         off;
    }

    # Ops portal — proxy to ops Next.js app (basePath: /ops)
    location /ops {
        proxy_pass         http://ops;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Everything else — proxy to Next.js storefront
    location / {
        proxy_pass         http://storefront;
        proxy_http_version 1.1;

        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Connection         "";

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }
}
